
name: Deploy Showroom Ecommerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Inspect frontend build output
        run: |
          echo "Frontend directory:"
          ls -la frontend

          echo "Generated server files:"
          find frontend -maxdepth 6 -type f \
            \( -name 'index.mjs' \
               -o -name 'server.js' \
               -o -name 'handler.mjs' \
               -o -name 'index.js' \) \
            -print

          echo "Output directory tree:"
          if [ -d frontend/.output ]; then
            find frontend/.output -maxdepth 5 -type f | head -100
          else
            echo "No frontend/.output directory found"
          fi

          echo "Build directory tree:"
          if [ -d frontend/dist ]; then
            find frontend/dist -maxdepth 3 -type f | head -50
          else
            echo "No frontend/dist directory found"
          fi

      - name: Clean up
        if: always()
        run: echo "Diagnostic run complete. No production files were changed."
