name: Deploy Showroom Ecommerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL_Public_Test: https://api.decorden.luxury/api
          VITE_API_URL_Public: https://api.decorden.luxury/api
          VITE_API_URL: https://api.decorden.luxury/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: |
          set -eu
          npm install --package-lock-only --ignore-scripts
          npm install
          npm run build
          test -f .output/server/index.mjs
          grep -R -l 'api.decorden.luxury/api' .output/public/assets

      - name: Verify and package files
        run: |
          set -eu

          test -f frontend/.output/server/index.mjs
          test -f frontend/.output/nitro.json
          test -f backend/server.js
          test -f backend/routes/user.route.js

          grep -q '"preset": "node-server"' frontend/.output/nitro.json

          node -e "
            const p = require('./backend/package.json');
            if (!p.dependencies || !p.dependencies['google-auth-library']) {
              console.error('google-auth-library is missing from backend dependencies');
              process.exit(1);
            }
          "

          tar -czf frontend-build.tar.gz \
            -C frontend .output

          tar -czf backend-source.tar.gz \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.htaccess' \
            --exclude='tmp' \
            --exclude='uploads' \
            --exclude='logs' \
            -C backend .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Upload deployment archives
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            frontend-build.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:frontend-build.tar.gz"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            backend-source.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:backend-source.tar.gz"

      - name: Deploy to cPanel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eu

          FRONTEND="$HOME/decorden.luxury"
          BACKEND="$HOME/api.decorden.luxury"
          RELEASE_ID="$(date +%Y%m%d%H%M%S)"
          FRONTEND_BACKUP="$HOME/decorden-frontend-output-backup-$RELEASE_ID"

          # Verify production configuration before deployment.
          test -f "$FRONTEND/server.js"
          test -f "$BACKEND/server.js"
          test -f "$FRONTEND/.htaccess"
          test -f "$BACKEND/.htaccess"
          test -f "$FRONTEND/.env"
          test -f "$BACKEND/.env"
          test -f "$HOME/frontend-build.tar.gz"
          test -f "$HOME/backend-source.tar.gz"

          mkdir -p "$FRONTEND/tmp" "$BACKEND/tmp"

          # Extract the new frontend build into a temporary directory.
          STAGING="$HOME/decorden-frontend-staging-$RELEASE_ID"
          mkdir -p "$STAGING"
          tar -xzf "$HOME/frontend-build.tar.gz" -C "$STAGING"

          # Validate the new frontend build before touching the live output.
          test -f "$STAGING/.output/server/index.mjs"
          test -f "$STAGING/.output/nitro.json"
          grep -q '"preset": "node-server"' "$STAGING/.output/nitro.json"

          # Back up the current frontend output.
          if [ -d "$FRONTEND/.output" ]; then
            mv "$FRONTEND/.output" "$FRONTEND_BACKUP"
          fi

          # Install the fresh output without obsolete assets.
          if ! mv "$STAGING/.output" "$FRONTEND/.output"; then
            if [ -d "$FRONTEND_BACKUP" ]; then
              mv "$FRONTEND_BACKUP" "$FRONTEND/.output"
            fi
            echo "Frontend deployment failed; previous output restored."
            exit 1
          fi

          rmdir "$STAGING" 2>/dev/null || true

          # Deploy backend source, preserving .env, node_modules,
          # .htaccess, uploads, logs and tmp.
          tar -xzf "$HOME/backend-source.tar.gz" -C "$BACKEND"

          test -f "$BACKEND/routes/user.route.js"

          echo "Checking deployed Google login route:"
          grep -n 'googleLogin' "$BACKEND/routes/user.route.js" || true

          # Confirm the production dependency is declared.
          if ! grep -q '"google-auth-library"' "$BACKEND/package.json"; then
            echo "google-auth-library is missing from deployed package.json"
            exit 1
          fi

          # Restart both Passenger applications.
          touch "$FRONTEND/tmp/restart.txt"
          touch "$BACKEND/tmp/restart.txt"

          rm -f "$HOME/frontend-build.tar.gz"
          rm -f "$HOME/backend-source.tar.gz"

          echo "Frontend deployed with Node.js preset."
          echo "Previous frontend output backup: $FRONTEND_BACKUP"
          echo "Deployment files copied successfully."
          REMOTE

      - name: Verify live backend API
        run: |
          set -eu
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error \
              --max-time 15 \
              https://api.decorden.luxury/api/products \
              -o /tmp/products-response.json; then
              echo "Backend products API is responding successfully."
              exit 0
            fi
            echo "Backend API not ready yet; retrying..."
            sleep 5
          done

          echo "Backend API health check failed."
          exit 1

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
