name: Deploy Showroom Ecommerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showroom-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Verify and package files
        run: |
          set -eu

          test -f frontend/.output/server/index.mjs
          test -f backend/server.js
          test -f backend/routes/user.route.js

          tar -czf frontend-build.tar.gz \
            -C frontend .output

          tar -czf backend-source.tar.gz \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.htaccess' \
            --exclude='tmp' \
            --exclude='uploads' \
            --exclude='logs' \
            -C backend .

      - name: Configure SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -eu

          test -n "$DEPLOY_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Upload deployment archives
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            frontend-build.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:frontend-build.tar.gz"

          scp -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            backend-source.tar.gz \
            "$DEPLOY_USER@$DEPLOY_HOST:backend-source.tar.gz"

      - name: Deploy to cPanel
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -eu

          ssh -i ~/.ssh/deploy_key \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -se' <<'REMOTE'
          set -eu

          FRONTEND="$HOME/decorden.luxury"
          BACKEND="$HOME/api.decorden.luxury"

          test -f "$FRONTEND/server.js"
          test -f "$BACKEND/server.js"
          test -f "$FRONTEND/.htaccess"
          test -f "$BACKEND/.htaccess"
          test -f "$FRONTEND/.env"
          test -f "$BACKEND/.env"

          test -f "$HOME/frontend-build.tar.gz"
          test -f "$HOME/backend-source.tar.gz"

          mkdir -p "$FRONTEND/tmp" "$BACKEND/tmp"

          tar -xzf "$HOME/frontend-build.tar.gz" -C "$FRONTEND"
          tar -xzf "$HOME/backend-source.tar.gz" -C "$BACKEND"

          test -f "$FRONTEND/.output/server/index.mjs"
          test -f "$BACKEND/routes/user.route.js"

          echo "Checking deployed Google login route:"
          grep -n 'googleLogin' "$BACKEND/routes/user.route.js" || true

          touch "$FRONTEND/tmp/restart.txt"
          touch "$BACKEND/tmp/restart.txt"

          rm -f "$HOME/frontend-build.tar.gz"
          rm -f "$HOME/backend-source.tar.gz"

          echo "Deployment files copied successfully."
          REMOTE

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
